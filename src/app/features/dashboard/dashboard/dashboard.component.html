<div class="dashboard-container" [class.fullscreen]="layoutConfig?.fullScreen">
  <app-header></app-header>
  
  <mat-sidenav-container class="sidenav-container">
    <mat-sidenav #sidenav [opened]="showSidebar" [mode]="'side'" class="sidenav">
      <app-sidebar></app-sidebar>
      <app-sliders *ngIf="hasData"></app-sliders>
      <app-data-settings *ngIf="hasData"></app-data-settings>
    </mat-sidenav>
    
    <mat-sidenav-content class="sidenav-content">
      <div class="toolbar-container">
        <mat-toolbar color="primary" class="view-toolbar">
          <button mat-icon-button (click)="toggleSidebar()">
            <mat-icon>{{ showSidebar ? 'chevron_left' : 'chevron_right' }}</mat-icon>
          </button>
          
          <mat-button-toggle-group [value]="layoutConfig?.activeView">
            <mat-button-toggle value="all" (click)="setActiveView('all')">
              All
            </mat-button-toggle>
            <mat-button-toggle value="parallel" (click)="setActiveView('parallel')">
              Parallel
            </mat-button-toggle>
            <mat-button-toggle value="scatter" (click)="setActiveView('scatter')">
              Scatter
            </mat-button-toggle>
            <mat-button-toggle value="thumbnails" (click)="setActiveView('thumbnails')">
              Thumbnails
            </mat-button-toggle>
            <mat-button-toggle value="viewer" (click)="setActiveView('viewer')">
              Viewer
            </mat-button-toggle>
          </mat-button-toggle-group>
          
          <span class="toolbar-spacer"></span>
          
          <button mat-icon-button (click)="toggleFullScreen()">
            <mat-icon>{{ layoutConfig?.fullScreen ? 'fullscreen_exit' : 'fullscreen' }}</mat-icon>
          </button>
        </mat-toolbar>
      </div>
      
      <div class="content-container">
        <ng-container *ngIf="hasData; else noData">
          <!-- Visualization components -->
          <div class="grid-container" *ngIf="layoutConfig?.activeView === 'all' || layoutConfig?.activeView === 'parallel'">
            <mat-card class="mat-elevation-z2">
              <mat-card-header>
                <mat-card-title>Parallel Coordinates</mat-card-title>
              </mat-card-header>
              <mat-card-content>
                <app-parallel-coordinates></app-parallel-coordinates>
              </mat-card-content>
            </mat-card>
          </div>
          
          <div class="grid-container" *ngIf="layoutConfig?.activeView === 'all' || layoutConfig?.activeView === 'scatter'">
            <div class="grid-item">
              <mat-card class="mat-elevation-z2">
                <mat-card-header>
                  <mat-card-title>Scatter Chart</mat-card-title>
                </mat-card-header>
                <mat-card-content>
                  <app-scatter-chart></app-scatter-chart>
                </mat-card-content>
              </mat-card>
            </div>
            <div class="grid-item" *ngIf="layoutConfig?.activeView === 'all'">
              <mat-card class="mat-elevation-z2">
                <mat-card-header>
                  <mat-card-title>Viewer</mat-card-title>
                </mat-card-header>
                <mat-card-content>
                  <app-viewer></app-viewer>
                </mat-card-content>
              </mat-card>
            </div>
          </div>
          
          <div class="grid-container" *ngIf="layoutConfig?.activeView === 'viewer'">
            <mat-card class="mat-elevation-z2">
              <mat-card-header>
                <mat-card-title>Viewer</mat-card-title>
              </mat-card-header>
              <mat-card-content>
                <app-viewer></app-viewer>
              </mat-card-content>
            </mat-card>
          </div>
          
          <div class="grid-container" *ngIf="layoutConfig?.activeView === 'all' || layoutConfig?.activeView === 'thumbnails'">
            <mat-card class="mat-elevation-z2">
              <mat-card-header>
                <mat-card-title>Thumbnails</mat-card-title>
              </mat-card-header>
              <mat-card-content>
                <app-thumbnails-grid></app-thumbnails-grid>
              </mat-card-content>
            </mat-card>
          </div>
        </ng-container>
        
        <ng-template #noData>
          <div class="no-data-container">
            <app-data-loader></app-data-loader>
          </div>
        </ng-template>
      </div>
      
      <!-- Loading overlay -->
      <div class="loading-overlay" *ngIf="isLoading">
        <mat-progress-spinner color="primary" mode="indeterminate"></mat-progress-spinner>
      </div>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
