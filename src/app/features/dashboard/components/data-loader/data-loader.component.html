<div class="data-loader-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Load Data</mat-card-title>
    </mat-card-header>
    
    <mat-card-content>
      <mat-error *ngIf="error">
        {{ error }}
      </mat-error>
      
      <div class="data-loader-grid">
        <div class="data-loader-section">
          <h3 class="section-title">Google Drive</h3>
          
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Google Drive Folder Link</mat-label>
            <input matInput [(ngModel)]="folderLink" placeholder="Enter Google Drive folder link">
            <mat-hint>Enter a Google Drive folder link containing CSV data</mat-hint>
          </mat-form-field>
          
          <button mat-raised-button color="primary" (click)="loadFromGoogleDrive()" [disabled]="loading">
            <mat-spinner *ngIf="loading" diameter="20" class="button-spinner"></mat-spinner>
            <span>Load</span>
          </button>
        </div>
        
        <div class="data-loader-section">
          <h3 class="section-title">Local File</h3>
          
          <div class="file-input-container">
            <button mat-stroked-button (click)="fileInput.click()" class="file-select-button">
              <mat-icon>attach_file</mat-icon>
              {{ csvFile?.name || 'Choose CSV file' }}
            </button>
            <input #fileInput type="file" accept=".csv" (change)="onFileSelected($event)" style="display: none">
          </div>
          
          <button mat-raised-button color="primary" (click)="loadFromFile()" [disabled]="!csvFile || loading" class="mt-3">
            <mat-spinner *ngIf="loading" diameter="20" class="button-spinner"></mat-spinner>
            <span>Load File</span>
          </button>
        </div>
      </div>
      
      <div class="default-data-section">
        <p>Or load sample data</p>
        <button mat-stroked-button color="primary" (click)="loadDefaultData()" [disabled]="loading">
          <mat-spinner *ngIf="loading" diameter="20" class="button-spinner"></mat-spinner>
          <span>Load Default Data</span>
        </button>
      </div>
    </mat-card-content>
  </mat-card>
</div>
