server {
  listen 8080;
  server_name _;

  port_in_redirect off;
  absolute_redirect off;

  root  /usr/share/nginx/html;
  index index.html;

  # Health endpoint
  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 OK;
  }

  # Root - served as static site
  location / {
    try_files $uri $uri/ /index.html;
  }

  # --- STG ---
  location = /stg { return 302 /stg/; }
  location ^~ /stg/ {
    rewrite ^/stg/(.*)$ /$1 break;
    try_files $uri $uri/ /index.html;
  }

  # --- DEV ---
  location = /dev { return 302 /dev/; }
  location ^~ /dev/ {
    rewrite ^/dev/(.*)$ /$1 break;
    try_files $uri $uri/ /index.html;
  }

  # No-cache for index.html
  location = /index.html      { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
  location = /stg/index.html  { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
  location = /dev/index.html  { add_header Cache-Control "no-cache, no-store, must-revalidate"; }

  # Long cache for static assets
  location ~* \.(?:js|css|svg|png|jpe?g|gif|webp|ico|woff2?|eot|ttf|otf)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    access_log off;
    try_files $uri =404;
  }

  # Gzip
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    application/json
    application/javascript
    application/xml
    application/rss+xml
    image/svg+xml;
}
