<!doctype html>
<html lang="en" class="acpv-density--2">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Design Explorer · Analysis</title>
    <link rel="icon" href="favicon.png" />
    <link rel="stylesheet" href="theme/base.css?v=1" />
    <link rel="stylesheet" href="theme/tertiary/coral.css?v=1" />
    <link rel="stylesheet" href="theme/tokens/spacing.css?v=1" />
    <link rel="stylesheet" href="theme/tokens/scale.css?v=1" />
    <link rel="stylesheet" href="theme/tokens/sidenav.css?v=1" />
    <link rel="stylesheet" href="theme/tokens/sidesheet.css?v=1" />
    <link rel="stylesheet" href="theme/tokens/shape.css?v=1" />
    <link rel="stylesheet" href="theme/tokens/shape-material.css?v=1" />
    <link rel="stylesheet" href="theme/tokens/elevation.css?v=1" />
    <link rel="stylesheet" href="theme/tokens/motion.css?v=1" />
    <link rel="stylesheet" href="theme/tokens/typography.css?v=1" />
    <link rel="stylesheet" href="theme/tokens/icons.css?v=1" />
    <link rel="stylesheet" href="theme/tokens/z-index.css?v=1" />
    <link rel="stylesheet" href="theme/fonts.css?v=1" />
    <link rel="stylesheet" href="style.css?v=88" />
</head>
<body class="light-medium-contrast an-page">
    <!-- App bar as in index.html (acpv-appbar anatomy): app icon + title, the open study in the
         centre-side slot, the actions on the right. No hamburger (no sidebar): the corner cell holds
         "Back" instead, to where you came from. -->
    <header class="topbar acpv-appbar">
        <div class="acpv-appbar-left">
            <span class="acpv-appbar-menu-cell">
                <a id="backBtn" class="toolbar-button" href="index.html" aria-label="Back" title="Back" hidden>
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                </a>
            </span>
            <a class="acpv-app-logo" id="appHome" href="index.html" aria-label="Go to homepage">
                <img src="favicon.png" alt="" class="acpv-app-icon" />
                <p class="acpv-app-title">Design Explorer</p>
            </a>
        </div>
        <div class="acpv-appbar-center">
            <span id="projectName"></span>
            <span id="projectNote" class="muted"></span>
        </div>
        <div class="toolbar-right-actions">
            <a id="exploreLink" class="button" href="index.html" hidden title="The dashboard of this study">Explore</a>
            <button id="exportBtn" type="button" title="Vector PDF (A3) of the plan as framed now, with legend, rooms and scale">Export view</button>
            <button id="shareBtn" type="button">Copy link</button>
        </div>
    </header>

    <main id="app" class="an-layout" hidden>
        <!-- Left: what is shown and how to read it -->
        <aside class="an-side card" aria-label="Analysis">
            <div class="an-block">
                <span class="eyebrow">Analysis</span>
                <select id="analysisSelect" aria-label="Analysis"></select>
            </div>
            <div class="an-block an-score">
                <span id="scoreLabel" class="muted small"></span>
                <strong id="scoreValue"></strong>
                <span id="scoreHelp" class="muted small"></span>
            </div>
            <div class="an-block">
                <div id="legend" class="an-legend" aria-label="Colour legend"></div>
            </div>
            <details class="an-block an-rooms" open>
                <summary><span class="eyebrow">Rooms</span><span id="roomCount" class="muted small"></span></summary>
                <ul id="roomList"></ul>
            </details>
            <details class="an-block an-section">
                <summary>About this analysis</summary>
                <div id="description" class="about-body"></div>
            </details>
            <details class="an-block an-section">
                <summary>Parameters of this study</summary>
                <div id="parameters" class="about-body an-params"></div>
            </details>
        </aside>

        <!-- Right: the plan, vector, pan and zoom -->
        <section class="an-view card" aria-label="Plan">
            <div id="plan" class="an-plan"></div>
            <!-- Levels over the plan, top right: highest first, like a section -->
            <div class="an-levels-box">
                <span class="eyebrow">Level</span>
                <div id="levelButtons" class="an-levels" aria-label="Levels"></div>
            </div>
            <div id="tooltip" class="an-tooltip" hidden></div>
            <div class="an-tools">
                <button id="zoomIn" type="button" aria-label="Zoom in">+</button>
                <button id="zoomOut" type="button" aria-label="Zoom out">−</button>
                <button id="labelsBtn" type="button" aria-pressed="true">Hide labels</button>
                <button id="resetView" type="button">Reset view</button>
            </div>
            <p class="an-hint muted small">Scroll to zoom · drag to move · double-click to reset</p>
            <p id="status" class="an-status muted small"></p>
        </section>
    </main>

    <div id="message" class="message" hidden></div>

    <script type="module" src="analysis.js?v=19"></script>
</body>
</html>
