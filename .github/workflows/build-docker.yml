name: _Reusable - Build & Push Docker

on:
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string
      docker_tags:
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push all tags with provenance
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.app_name }}
          TAGS_CSV: ${{ inputs.docker_tags }}
        run: |
          IFS=',' read -ra TAGS <<< "$TAGS_CSV"
          BUILD_ARGS=()
          for T in "${TAGS[@]}"; do
            BUILD_ARGS+=(-t "$IMAGE:$T")
          done

          docker buildx build \
            --no-cache \
            --provenance=true \
            --sbom=true \
            --attest type=sbom \
            --push \
            --file Dockerfile \
            "${BUILD_ARGS[@]}" \
            .
